# Local smoke-test configuration.
#
# Pairs with any TCP echo backend on 127.0.0.1:9001:
#   :8080  →  127.0.0.1:9001
#
# Run:
#   go run ./cmd/wasmgate -config configs/local-echo.yaml -log-level debug
version: 1

# Watch the proxy while smoke-testing: curl http://127.0.0.1:9098/metrics
admin_addr: "127.0.0.1:9098"

listeners:
  - name: echo
    addr: "127.0.0.1:8080"
    upstream_pool: echo
    dial_timeout: 2s

pools:
  echo:
    balance: round_robin
    servers:
      - "127.0.0.1:9001"
