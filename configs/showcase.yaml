# WasmGate — showcase configuration for the example WASM plugins.
#
# Every listener below maps one nginx feature set onto a WASM plugin. The
# upstream addresses are examples; nothing needs to be running to validate the
# file:
#
#   go run ./cmd/wasmgate -config configs/showcase.yaml -validate
#
# All plugins are committed as prebuilt .wasm files. ABI v4 L7 ports are still
# landing; see ../plugins/examples/README.md and
# docs/plans/m2-v4-only-runtime.md for the current compatibility matrix.
version: 1

admin_addr: "127.0.0.1:9098"
admin_pprof: false
admin_allow_remote: false

listeners:
  # ABI v4 L4 example is pending. The committed ipguard.wasm is v3 and is
  # rejected by M3; the v4 lifecycle path is covered by proxy tests.
  #
  # - name: showcase-ipguard
  #   addr: "127.0.0.1:8100"
  #   upstream_pool: web
  #   plugin:
  #     path: "../plugins/examples/ipguard/ipguard.wasm"
  #     max_memory_pages: 16
  #     timeout: 1s

  # ABI v3 L7 examples (http_guard, path_router, sni_guard, protocol_router,
  # redis_guard, stream_guard, http_body_guard) are not runnable in M2: every
  # data_mode is now ABI v4 and those committed .wasm files still export v3
  # hooks. Ports are tracked in docs/plans/m2-v4-only-runtime.md.
  #
  # ABI v4 examples for once/stream/headers will be added with the Rust v4 SDK.

  # The same ssl_preread routing without any WASM: useful as a baseline when
  # explaining what the plugin adds (arbitrary policy vs. a static map).
  - name: showcase-native-sni
    addr: "127.0.0.1:8107"
    upstream_pool: web
    sni_routes:
      "api.example.com": api
      "*.example.com": web

  # TLS termination examples are pending an ABI v4 plugin port. Uncomment after
  # generating certs and adding a v4 module:
  #
  # - name: showcase-tls-termination
  #   addr: "127.0.0.1:8108"
  #   upstream_pool: web
  #   tls:
  #     cert_file: "../certs/server.crt"
  #     key_file: "../certs/server.key"
  #     min_version: "1.2"
  #     handshake_timeout: 10s

pools:
  web:
    servers: ["127.0.0.1:9000"]
  api:
    servers: ["127.0.0.1:9001", "127.0.0.1:9002"]
  static:
    servers: ["127.0.0.1:9010"]
  ws:
    servers: ["127.0.0.1:9020"]
  internal:
    servers: ["127.0.0.1:9030"]
  tls-backend:
    servers: ["127.0.0.1:9443"]
  http-backend:
    servers: ["127.0.0.1:9080"]
  ssh-backend:
    servers: ["127.0.0.1:22"]
  postgres:
    servers: ["127.0.0.1:5432"]
  redis:
    servers: ["127.0.0.1:6379"]

