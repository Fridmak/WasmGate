# WasmGate — showcase configuration for the example WASM plugins.
#
# Every listener below maps one nginx feature set onto a WASM plugin. The
# upstream addresses are examples; nothing needs to be running to validate the
# file:
#
#   go run ./cmd/wasmgate -config configs/showcase.yaml -validate
#
# The prebuilt plugins below use ABI v4. See ../plugins/examples/README.md
# for each policy's limits before using it outside a loopback demo.
version: 1

admin_addr: "127.0.0.1:9098"
admin_pprof: false
admin_allow_remote: false

listeners:
  - name: showcase-ipguard
    addr: "127.0.0.1:8100"
    upstream_pool: web
    plugin:
      path: "../plugins/examples/ipguard/ipguard.wasm"

  # The Basic credentials in http_guard are public demo credentials.
  - name: showcase-http-guard
    addr: "127.0.0.1:8101"
    upstream_pool: web
    plugin:
      path: "../plugins/examples/http_guard/http_guard.wasm"
      data_mode: headers
      timeout: 1s

  - name: showcase-path-router
    addr: "127.0.0.1:8102"
    upstream_pool: web
    plugin:
      path: "../plugins/examples/path_router/path_router.wasm"
      data_mode: headers
      timeout: 1s
      route_pools: [api, static, ws]

  - name: showcase-sni-guard
    addr: "127.0.0.1:8103"
    upstream_pool: web
    # A native SNI route also enables the full initial TLS record peek.
    sni_routes:
      "*.example.com": web
    plugin:
      path: "../plugins/examples/sni_guard/sni_guard.wasm"
      data_mode: once
      route_pools: [api, static, internal]

  - name: showcase-protocol-router
    addr: "127.0.0.1:8104"
    upstream_pool: web
    plugin:
      path: "../plugins/examples/protocol_router/protocol_router.wasm"
      data_mode: once
      route_pools: [tls-backend, http-backend, ssh-backend, postgres, redis]

  - name: showcase-redis-guard
    addr: "127.0.0.1:8105"
    upstream_pool: redis
    plugin:
      path: "../plugins/examples/redis_guard/redis_guard.wasm"
      data_mode: stream

  - name: showcase-stream-guard
    addr: "127.0.0.1:8106"
    upstream_pool: web
    plugin:
      path: "../plugins/examples/stream_guard/stream_guard.wasm"
      data_mode: stream

  # The same ssl_preread routing without any WASM: useful as a baseline when
  # explaining what the plugin adds (arbitrary policy vs. a static map).
  - name: showcase-native-sni
    addr: "127.0.0.1:8107"
    upstream_pool: web
    sni_routes:
      "api.example.com": api
      "*.example.com": web

  # TLS termination can be combined with headers inspection. Uncomment after
  # generating certs:
  #
  # - name: showcase-tls-termination
  #   addr: "127.0.0.1:8108"
  #   upstream_pool: web
  #   tls:
  #     cert_file: "../certs/server.crt"
  #     key_file: "../certs/server.key"
  #     min_version: "1.2"
  #     handshake_timeout: 10s
  #   plugin:
  #     path: "../plugins/examples/http_headers_guard/http_headers_guard.wasm"
  #     data_mode: headers
  #     timeout: 1s

  - name: showcase-http-body
    addr: "127.0.0.1:8109"
    upstream_pool: web
    idle_timeout: 30s
    plugin:
      path: "../plugins/examples/http_body_guard/http_body_guard.wasm"
      data_mode: headers
      timeout: 1s
      body_policy: both
      mutation_policy: replace

  - name: showcase-http-headers
    addr: "127.0.0.1:8110"
    upstream_pool: web
    plugin:
      path: "../plugins/examples/http_headers_guard/http_headers_guard.wasm"
      data_mode: headers
      timeout: 1s

pools:
  web:
    servers: ["127.0.0.1:9000"]
  api:
    servers: ["127.0.0.1:9001", "127.0.0.1:9002"]
  static:
    servers: ["127.0.0.1:9010"]
  ws:
    servers: ["127.0.0.1:9020"]
  internal:
    servers: ["127.0.0.1:9030"]
  tls-backend:
    servers: ["127.0.0.1:9443"]
  http-backend:
    servers: ["127.0.0.1:9080"]
  ssh-backend:
    servers: ["127.0.0.1:22"]
  postgres:
    servers: ["127.0.0.1:5432"]
  redis:
    servers: ["127.0.0.1:6379"]
