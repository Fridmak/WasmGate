# WasmGate — example configuration (MVP, L4 TCP).
#
# The gateway is a raw TCP reverse proxy: it accepts connections on `listeners`
# and forwards them to one of the backends in the referenced pool.
version: 1

# Optional observability endpoint: /metrics (Prometheus text), /healthz and
# /debug/pprof/. Keep it on loopback unless you really want it exposed.
# Empty or omitted = disabled.
admin_addr: "127.0.0.1:9099"

listeners:
  - name: edge
    addr: "127.0.0.1:8080"
    upstream_pool: web
    max_conns: 10000          # max concurrent connections (0 = unlimited)
    dial_timeout: 3s          # upstream dial timeout
    idle_timeout: 0s          # connection idle timeout; 0 = disabled (keeps zero-copy
                              # splice). When enabled, the deadline is refreshed by activity
                              # in EITHER direction, so a slow one-way download is not cut;
                              # set e.g. 60s in production to reap silent conns.
    rate_limit:               # optional per-IP/subnet sliding-window rate limit (F2)
      max: 200                # max new connections per IP per window (0 = disabled)
      subnet_max: 1000        # max new connections per /24 (IPv4) or /64 (IPv6) per window (0 = disabled)
      window: 1s              # sliding window length (default 1s, min 10ms)
      ban_duration: 5s        # base ban TTL on violation, exponentially backed off up to 16x (0 = no ban)
      allow_cidrs:            # CIDRs bypassed before counting
        - "127.0.0.1/32"
    # Optional WASM plugin (L4 on_accept / on_close + L7 on_data inspection, mutation & routing):
    # plugin:
    #   path: "plugins/examples/ipguard/ipguard.wasm"
    #   max_memory_pages: 16
    #   data_mode: "once"     # "once" (first packet, preserves Linux splice) | "stream" (every chunk)
    #   route_pools: ["web"]  # selectable by on_data return value (2 -> route_pools[0], ...)
    # Optional TLS termination (hot-reloaded on SIGHUP / POST /reload):
    # tls:
    #   cert_file: "certs/server.crt"
    #   key_file: "certs/server.key"
    #   min_version: "1.2"

  - name: db
    addr: "127.0.0.1:5433"
    upstream_pool: postgres
    dial_timeout: 2s

pools:
  web:
    balance: round_robin      # round_robin | least_conn
    dial_retries: 1           # transparent dial retries onto another healthy server in the pool
    circuit_breaker:          # optional three-state passive circuit breaker (Closed -> Open -> Half-Open)
      error_threshold: 5
      open_duration: 10s
      half_open_requests: 2
    servers:
      - "127.0.0.1:9001"
      - "127.0.0.1:9002"

  postgres:
    balance: least_conn
    servers:
      - "127.0.0.1:5432"
