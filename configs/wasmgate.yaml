# WasmGate — example configuration.
#
# The gateway is a raw TCP reverse proxy: it accepts connections on `listeners`
# and forwards them to one of the backends in the referenced pool. Optional
# layers on top: rate limiting, WASM plugins (L4 hooks + L7 `on_data` /
# `on_data_ex` / `on_data_state`), TLS passthrough (SNI peek) or termination,
# health checks and a circuit breaker.
#
# Validation: `wasmgate -config configs/wasmgate.yaml -validate`.
version: 1

# Optional observability endpoint: /metrics (Prometheus text), /healthz,
# /reload (POST) and optionally /debug/pprof/. Keep it on loopback unless you
# really want it exposed. Empty or omitted = disabled.
# Non-loopback admin_addr requires admin_allow_remote: true and a token.
admin_addr: "127.0.0.1:9099"
# admin_token_file: "/etc/wasmgate/admin.token"  # or WASMGATE_ADMIN_TOKEN
admin_pprof: false        # pprof is dangerous: enable only for local debugging
admin_allow_remote: false

listeners:
  - name: edge
    addr: "127.0.0.1:8080"
    upstream_pool: web
    max_conns: 10000          # max concurrent connections (0 = unlimited)
    dial_timeout: 3s          # upstream dial timeout
    idle_timeout: 0s          # connection idle timeout; 0 = disabled (keeps zero-copy
                              # splice). When enabled, the deadline is refreshed by activity
                              # in EITHER direction, so a slow one-way download is not cut;
                              # set e.g. 60s in production to reap silent conns.
    rate_limit:               # optional per-IP/subnet sliding-window rate limit (F2)
      max: 200                # max new connections per IP per window (0 = disabled)
      subnet_max: 1000        # max new connections per subnet per window (0 = disabled)
      max_concurrent: 0       # concurrent connections per IP (0 = disabled; WARN at startup)
      subnet_max_concurrent: 0 # concurrent connections per subnet (0 = disabled)
      ipv6_host_prefix: 64    # IPv6 per-IP grouping (default 64)
      ipv6_subnet_prefix: 56  # IPv6 subnet grouping (default 56)
      window: 1s              # sliding window length (default 1s, min 10ms)
      ban_duration: 5s        # base ban TTL on violation, exponentially backed off up to 16x (0 = no ban)
      allow_cidrs:            # CIDRs bypassed before counting
        - "127.0.0.1/32"
    # Optional WASM plugin (L4 on_accept / on_close + L7 on_data inspection, mutation & routing).
    # The module must export at least one of on_accept / on_data / on_close.
    # plugin:
    #   path: "plugins/examples/ipguard/ipguard.wasm"
    #   max_memory_pages: 16   # 16 pages = 1 MiB linear-memory cap per instance
    #   timeout: 0s            # per-hook timeout; 0 = no timer (trusted plugin only; WARN)
    #   data_mode: "once"      # "once" (first packet, preserves Linux splice) | "stream" (every chunk)
    #   route_pools: ["web"]   # selectable by on_data return value (2 -> route_pools[0], ...)
    #
    # Optional TLS passthrough routing by SNI: the proxy reads only the
    # ClientHello, picks a pool and replays the bytes, so end-to-end TLS and
    # Linux `splice(2)` are preserved. Ignored when `tls` (termination) is set.
    # sni_routes:
    #   "api.example.com": web
    #   "*.example.com": web
    #
    # Optional TLS termination (hot-reloaded on SIGHUP / POST /reload):
    # the client socket becomes *tls.Conn, so `splice(2)` is disabled for the
    # connection; in exchange WASM `on_data` sees plaintext.
    # tls:
    #   cert_file: "certs/server.crt"
    #   key_file: "certs/server.key"
    #   min_version: "1.2"     # "1.2" | "1.3"
    #   handshake_timeout: 10s # TLS handshake deadline (default 10s)

  - name: db
    addr: "127.0.0.1:5433"
    upstream_pool: postgres
    dial_timeout: 2s

pools:
  web:
    balance: round_robin      # round_robin | least_conn
    dial_retries: 1           # extra dial attempts on other healthy pool members (total 1+N)
    health_check:             # optional active TCP probe; passive mark-unhealthy always on
      interval: 2s            # probe period (0 = no active probing)
      timeout: 1s             # per-probe dial timeout (default 1s)
    circuit_breaker:          # optional three-state passive circuit breaker (Closed -> Open -> Half-Open)
      error_threshold: 5      # consecutive dial failures to open (0 = open after the first)
      open_duration: 10s      # Open -> Half-Open (default 10s when threshold > 0)
      half_open_requests: 2   # consecutive successes to close (default 1)
    servers:
      - "127.0.0.1:9001"
      - "127.0.0.1:9002"

  postgres:
    balance: least_conn
    servers:
      - "127.0.0.1:5432"
