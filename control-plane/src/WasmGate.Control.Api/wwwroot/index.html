<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>WasmGate Control Plane</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Ctext x='16' y='23' font-size='19' font-family='system-ui' font-weight='700' fill='white' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">W</div>
        <div>
          <strong>WasmGate</strong>
          <span>control plane</span>
        </div>
      </div>
      <nav id="nav">
        <button class="nav-item active" data-view="dashboard">Dashboard</button>
        <button class="nav-item" data-view="agents">Agents</button>
        <button class="nav-item" data-view="artifacts">Artifacts</button>
        <button class="nav-item" data-view="configs">Configurations</button>
        <button class="nav-item" data-view="releases">Releases</button>
        <button class="nav-item" data-view="deployments">Deployments</button>
        <button class="nav-item" data-view="audit">Audit</button>
      </nav>
      <div class="sidebar-foot">
        <div id="health" class="health"><span class="dot"></span><span>checking…</span></div>
        <p class="hint">Admin API has no user accounts: the bearer token from
          <code>WASMGATE_CP_ADMIN_TOKEN</code> is the only credential.</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="field env">
          <label for="env">Environment</label>
          <input id="env" autocomplete="off" spellcheck="false">
        </div>
        <div class="field grow">
          <label for="token">Admin token</label>
          <input id="token" type="password" autocomplete="off" placeholder="not required on loopback">
        </div>
        <button id="save" class="btn primary" type="button">Save</button>
        <button id="refresh" class="btn" type="button">Refresh</button>
      </header>

      <div id="banner" class="banner" hidden></div>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="btn icon" data-close type="button" aria-label="Close">✕</button>
      </header>
      <div id="modal-body" class="modal-body"></div>
      <footer id="modal-foot" class="modal-foot"></footer>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
