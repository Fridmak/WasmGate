name: wasmgate-observability

# Prometheus + Grafana for one or more WasmGate instances.
#
# The stack joins an existing Docker network so it can scrape container names
# such as data-plane:9099 and control-plane:9097. For local-demo:
#
#   docker compose -f deployments/scenarios/01-local-demo/compose.yml --profile dp up -d
#   ./deployments/observability/setup.sh
#   docker compose -f deployments/observability/compose.yml up -d
#
# Open Grafana on http://127.0.0.1:3000 (admin / GRAFANA_ADMIN_PASSWORD).

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./secrets/wasmgate-admin-token:/etc/prometheus/wasmgate-admin-token:ro
      - ./secrets/cp-admin-token:/etc/prometheus/cp-admin-token:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - wasmgate

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/wasmgate.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - wasmgate

volumes:
  promdata:
  grafanadata:

networks:
  wasmgate:
    external: true
    name: ${WASMGATE_NETWORK:-wasmgate-demo_default}
