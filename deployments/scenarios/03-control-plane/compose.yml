# Control plane with SQLite, no data plane.
#
# Use this when agents run elsewhere (VMs, Kubernetes, another compose project).
# SQLite is built in, so no database container is required.
#
#   ./deployments/scripts/dev-certs.sh
#   cp deployments/scenarios/03-control-plane/.env.example \
#      deployments/scenarios/03-control-plane/.env
#   # set WASMGATE_CP_ADMIN_TOKEN in .env
#   docker compose -f deployments/scenarios/03-control-plane/compose.yml up -d --build
#
# SECURITY
# - Both endpoints are published on the host loopback only.
# - The agent endpoint runs with TLS: the control plane refuses to start on a
#   non-loopback plaintext gRPC address, so deployments/certs must exist.
# - The admin API requires WASMGATE_CP_ADMIN_TOKEN, because inside the container
#   it listens on 0.0.0.0 and would otherwise be reachable through the published
#   port without authentication.
#
# The data plane is intentionally not part of this scenario. Create an agent in
# the UI, then start the data plane with the token, agent id, server certificate
# and release-signing public key. See ../02-standalone-data-plane and
# ../05-dp-fleet.
name: wasmgate-control

services:
  control-plane:
    build:
      context: ../../..
      dockerfile: deployments/docker/control-plane.Dockerfile
    restart: unless-stopped
    environment:
      WASMGATE_CP_SQLITE_PATH: "/data/control.db"
      WASMGATE_CP_AGENT_CA_KEY: "/data/ca/agents-ca.key"
      WASMGATE_CP_SIGNING_KEY: "/data/keys/release-signing.key"
      WASMGATE_CP_GRPC_LISTEN: "https://0.0.0.0:9096"
      WASMGATE_CP_HTTP_LISTEN: "http://0.0.0.0:9097"
      WASMGATE_CP_GRPC_TLS_CERT: "/certs/server.crt"
      WASMGATE_CP_GRPC_TLS_KEY: "/certs/server.key"
      WASMGATE_CP_GRPC_CLIENT_CA: "/data/ca/agents-ca.crt"
      WASMGATE_CP_ADMIN_TOKEN: "${WASMGATE_CP_ADMIN_TOKEN:?set WASMGATE_CP_ADMIN_TOKEN in .env}"
    ports:
      - "127.0.0.1:9096:9096"
      - "127.0.0.1:9097:9097"
    volumes:
      - cpdata:/data
      - ../../certs:/certs:ro

volumes:
  cpdata:
