# Local bring-up of the control plane and its database.
#
#   ./deployments/dev-certs.sh                 # once: TLS material for the demo
#   export WASMGATE_CP_ADMIN_TOKEN=$(openssl rand -hex 24)
#   docker compose -f deployments/docker-compose.yml up --build
#
# SECURITY
# - Both endpoints are published on the host loopback only.
# - The agent endpoint runs with TLS: the control plane refuses to start on a
#   non-loopback plaintext gRPC address, so `deployments/certs` must exist.
# - The admin API requires WASMGATE_CP_ADMIN_TOKEN, because inside the container
#   it listens on 0.0.0.0 and would otherwise be reachable through the published
#   port without authentication.
#
# The data plane is not started automatically: it needs an enrollment token and
# an agent id created through the admin API, plus the control-plane server
# certificate and the release-signing public key. Copy both into the agent
# volume, then see AGENT-PROTOCOL.md or run:
#
#   docker run --rm -it --network wasmgate_default \
#     -v wasmgate_dpstate:/data \
#     wasmgate-dp -config /data/wasmgate.yaml \
#       -cp https://control-plane:9096 -cp-server-ca /data/server.crt \
#       -cp-release-key /data/release-signing.key.pub \
#       -cp-token <token> -cp-agent-id <agent-id> \
#       -cp-name dp-01 -cp-state /data/agent
name: wasmgate

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: wasmgate
      POSTGRES_PASSWORD: wasmgate
      POSTGRES_DB: wasmgate
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 001 → 002 → 003, applied once when the volume is initialized.
      - ../control-plane/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wasmgate -d wasmgate"]
      interval: 2s
      timeout: 3s
      retries: 30

  control-plane:
    build:
      context: ..
      dockerfile: deployments/docker/control-plane.Dockerfile
    environment:
      WASMGATE_CP_POSTGRES: "Host=postgres;Port=5432;Database=wasmgate;Username=wasmgate;Password=wasmgate"
      WASMGATE_CP_AGENT_CA_KEY: "/data/ca/agents-ca.key"
      WASMGATE_CP_SIGNING_KEY: "/data/keys/release-signing.key"
      WASMGATE_CP_GRPC_LISTEN: "https://0.0.0.0:9096"
      WASMGATE_CP_GRPC_TLS_CERT: "/certs/server.crt"
      WASMGATE_CP_GRPC_TLS_KEY: "/certs/server.key"
      WASMGATE_CP_GRPC_CLIENT_CA: "/data/ca/agents-ca.crt"
      WASMGATE_CP_ADMIN_TOKEN: "${WASMGATE_CP_ADMIN_TOKEN:?set WASMGATE_CP_ADMIN_TOKEN to a random secret}"
    ports:
      - "127.0.0.1:9096:9096"
      - "127.0.0.1:9097:9097"
    volumes:
      - cpdata:/data
      - ./certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  cpdata:
